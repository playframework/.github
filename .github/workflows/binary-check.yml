name: Validate Binary Compatibility

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
      java:
        type: string
        required: false
        default: 17
      java-index:
        type: string
        required: false
        default: ''
      sbt-cache-namespace:
        type: string
        required: false
        default: ""
      ignore-job-coursier-cache:
        type: boolean
        required: false
        default: true
      extra-coursier-cache-key:
        type: string
        required: false
        default: ''
      run-scheduled-in-forks:
        type: boolean
        required: false
        default: false

jobs:
  cmd:
    name: JDK ${{ inputs.java }}
    if: >-
      github.event.repository.fork == false || 
      github.event_name != 'schedule' || 
      (github.event_name == 'schedule' && github.event.repository.fork == true && inputs.run-scheduled-in-forks == true)
    runs-on: ubuntu-24.04
    steps:
      - name: Block deprecated repos in /etc/hosts
        run: |
          sudo echo "127.0.0.1 repo.scala-sbt.org" | sudo tee -a /etc/hosts
          sudo echo "127.0.0.1 repo.typesafe.com" | sudo tee -a /etc/hosts
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # we don't know what commit the last tag was it's safer to get entire repo so previousStableVersion resolves
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Coursier Cache
        id: coursier-cache
        uses: coursier/cache-action@v9
        with:
          ignoreJob: ${{ inputs.ignore-job-coursier-cache }}
          ignoreMatrix: true
          extraKey: ${{ inputs.extra-coursier-cache-key }}

      - name: Install Adoptium Temurin OpenJDK
        uses: coursier/setup-action@v3
        with:
          jvm: adoptium:${{ inputs.java }}
          jvm-index: ${{ inputs.java-index }}

      - name: Install sbt
        uses: sbt/setup-sbt@v1
        with:
          disk-cache: ${{ inputs.sbt-cache-namespace == '' }}

      - name: Prepare sbt build cache key
        id: sbt-cache-key
        if: inputs.sbt-cache-namespace != ''
        shell: bash
        env:
          CACHE_NAMESPACE: ${{ inputs.sbt-cache-namespace }}
          CACHE_JAVA: ${{ inputs.java }}
          BUILD_HASH: ${{ hashFiles('**/*.sbt', '**/project/**/*.scala', '**/project/**/*.java', '**/project/**/*.properties') }}
        run: |
          jdk_hash=$(java -version 2>&1 | sha256sum | cut -d ' ' -f 1)
          matrix_hash=$(jq -ncS --arg java "$CACHE_JAVA" '{java: $java}' | sha256sum | cut -d ' ' -f 1)
          cache_prefix="sbt-build-v1-$RUNNER_OS-$RUNNER_ARCH-$CACHE_NAMESPACE-$jdk_hash-$matrix_hash"
          echo "prefix=$cache_prefix" >> "$GITHUB_OUTPUT"
          echo "build-prefix=$cache_prefix-$BUILD_HASH" >> "$GITHUB_OUTPUT"

      - name: sbt build cache
        if: inputs.sbt-cache-namespace != ''
        uses: actions/cache@v6
        with:
          path: ~/.cache/sbt
          key: ${{ steps.sbt-cache-key.outputs.build-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.sbt-cache-key.outputs.build-prefix }}-
            ${{ steps.sbt-cache-key.outputs.prefix }}-

      - name: Binary Compatibility
        run: sbt +mimaReportBinaryIssues

      - name: Cleanup before cache
        shell: bash
        run: |
          find $HOME/Library/Caches/Coursier/v1        -name "ivydata-*.properties" -delete || true
          find $HOME/.ivy2/cache                       -name "ivydata-*.properties" -delete || true
          find $HOME/.cache/coursier/v1                -name "ivydata-*.properties" -delete || true
          find $HOME/.sbt                              -name "*.lock"               -delete || true
